<!--componente para enviar mensajes de confirmación en modal
cada vez que realizamos algún tipo de acción como crear una receta-->
<section class="confirmacion">

  <div class="icono-confirmacion">
    <span aria-hidden="true">✓</span>
  </div>

  <h2>{{ titulo() }}</h2>

  <p>{{ mensaje() }}</p>

  <ng-content />

</section>
