<!-- CONFIRMACIÓN REUTILIZABLE -->
<section class="confirmacion">

  <!-- ICONO DE CONFIRMACIÓN -->
  <div class="icono-confirmacion">
    <span aria-hidden="true">✓</span>
  </div>

  <!-- TÍTULO -->
  <h2>{{ titulo() }}</h2>

  <!-- MENSAJE RECIBIDO DEL PADRE -->
  <p>{{ mensaje() }}</p>

  <!-- BOTÓN -->
  <button
    type="button"
    class="boton-aceptar"
    (click)="aceptar.emit()">
    {{ textoBoton() }}
  </button>

</section>
