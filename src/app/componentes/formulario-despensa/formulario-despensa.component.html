<!-- FORMULARIO REUTILIZABLE DE LA DESPENSA -->
<div class="formulario-despensa">

  <!-- CABECERA -->
  <div class="cabecera-formulario">

    <h2>
      {{ producto() ? 'Modificar ingrediente' : 'Añadir ingrediente' }}
    </h2>

    <button
      type="button"
      class="cerrar-modal"
      aria-label="Cerrar formulario"
      (click)="cerrar.emit()">
      ✕
    </button>

  </div>

  <!-- DESCRIPCIÓN -->
  <p class="descripcion-formulario">
    @if (producto()) {
      Actualiza la cantidad o la fecha de caducidad.
    } @else {
      Elige un ingrediente e indica cuánto tienes en casa.
    }
  </p>

  <!-- INGREDIENTE -->
  <div class="campo-despensa">

    <label for="ingrediente-despensa">Ingrediente</label>

    @if (producto(); as p) {

      <!-- AL MODIFICAR, EL INGREDIENTE NO SE CAMBIA -->
      <input
        id="ingrediente-despensa"
        type="text"
        [value]="p.ingrediente.nombre"
        disabled>

    } @else {

      <select
        id="ingrediente-despensa"
        [(ngModel)]="ingredienteId">

        <option [ngValue]="null" disabled>Selecciona un ingrediente</option>

        @for (ingrediente of ingredientes(); track ingrediente.id) {
          <option [ngValue]="ingrediente.id">{{ ingrediente.nombre }}</option>
        }

      </select>

    }

  </div>

  <!-- CANTIDAD Y CADUCIDAD -->
  <div class="fila-campos">

    <div class="campo-despensa">

      <label for="cantidad-despensa">
        Cantidad
        @if (ingredienteSeleccionado; as i) {
          ({{ unidades[i.unidad] }})
        }
      </label>

      <input
        id="cantidad-despensa"
        type="number"
        min="1"
        placeholder="Ej: 200"
        [(ngModel)]="cantidad">

    </div>

    <div class="campo-despensa">

      <label for="caducidad-despensa">Caducidad</label>

      <input
        id="caducidad-despensa"
        type="date"
        [(ngModel)]="caducidad">

    </div>

  </div>

  <!-- GUARDAR -->
  <button
    type="button"
    class="guardar-despensa"
    [disabled]="!formularioValido"
    (click)="enviar()">

    {{ producto() ? 'Guardar cambios' : 'Añadir a mi despensa' }}

  </button>

</div>
