<!-- componente cabecera reutilizable -->
<div class="cabecera">

  <!-- volvemos si la página nos lo pide -->
  @if (volver()) {

    <ion-back-button
      class="boton-volver"
      [defaultHref]="volver()"
      icon="arrow-back-outline"
      text="">
    </ion-back-button>

  }


  <img
    src="assets/fotos/logo-smartchef.png"
    alt="SmartChef"
    class="logo">

  <!-- usuario: icono sin login, avatar con login -->
  @if (sesion.comprobarSesion()) {

    <a
      routerLink="/perfil-usuario"
      class="avatar-usuario"
      aria-label="Ir a mi perfil">

      A

    </a>

  } @else {

    <a
      routerLink="/login"
      class="usuario"
      aria-label="Iniciar sesión">

      <ion-icon name="person-circle-outline"></ion-icon>

    </a>

  }

</div>
