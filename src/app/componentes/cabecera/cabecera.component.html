<!-- CABECERA REUTILIZABLE -->
<div class="cabecera">

  <!-- VOLVER (solo si la página lo pide) -->
  @if (volver()) {

    <ion-back-button
      class="boton-volver"
      [defaultHref]="volver()"
      icon="arrow-back-outline"
      text="">
    </ion-back-button>

  }

  <!-- LOGO SMARTCHEF -->
  <img
    src="assets/fotos/logo-smartchef.png"
    alt="SmartChef"
    class="logo">

  <!-- USUARIO: AVATAR CON SESIÓN, ICONO SIN SESIÓN -->
  @if (sesion.comprobarSesion()) {

    <a
      routerLink="/perfil-usuario"
      class="avatar-usuario"
      aria-label="Ir a mi perfil">

      A

    </a>

  } @else {

    <a
      routerLink="/login"
      class="usuario"
      aria-label="Iniciar sesión">

      <ion-icon name="person-circle-outline"></ion-icon>

    </a>

  }

</div>
