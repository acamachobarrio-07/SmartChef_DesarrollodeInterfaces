<!-- MENÚ DE PERFIL REUTILIZABLE -->
<div class="menu-perfil">

  <!-- INFORMACIÓN DEL USUARIO -->
  <div class="informacion-usuario">

    <!-- AVATAR CON INICIAL -->
    <div class="avatar-menu">
      {{ nombre().charAt(0).toUpperCase() }}
    </div>

    <!-- NOMBRE -->
    <div class="datos-usuario">
      <h3>{{ nombre() }}</h3>
      <p>Mi cuenta</p>
    </div>

  </div>

  <!-- SEPARADOR -->
  <div class="separador"></div>

  <!-- EDITAR PERFIL -->
  <button
    type="button"
    class="opcion-menu"
    (click)="editarPerfil.emit()">

    <span class="icono-menu" aria-hidden="true">
      ✎
    </span>

    <span>Editar perfil</span>

  </button>

  <!-- CERRAR SESIÓN -->
  <button
    type="button"
    class="opcion-menu opcion-salir"
    (click)="cerrarSesion.emit()">

    <span class="icono-menu" aria-hidden="true">
      ↪
    </span>

    <span>Cerrar sesión</span>

  </button>

</div>
