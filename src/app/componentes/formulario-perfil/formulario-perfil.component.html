<!-- FORMULARIO REUTILIZABLE DEL PERFIL (de escaparate: muestra los datos, no los guarda) -->
<div class="formulario-perfil">

  <!-- CABECERA -->
  <div class="cabecera-perfil">

    <h2>Editar perfil</h2>

    <button
      type="button"
      class="cerrar-perfil"
      aria-label="Cerrar formulario"
      [routerLink]="volver()"
      routerDirection="back">
      ✕
    </button>

  </div>

  <!-- AVATAR DEL USUARIO -->
  <div class="informacion-perfil">

    <div class="avatar-perfil">
      @if (datos().imagenPerfil; as imagen) {
        <img [src]="imagen" alt="Imagen de perfil" class="imagen-perfil">
      } @else {
        {{ datos().nombre.charAt(0).toUpperCase() }}
      }
    </div>

    <h3>{{ datos().nombre }}</h3>
    <p>Personaliza tu cuenta de SmartChef</p>

    <!-- CAMBIAR IMAGEN (en la maqueta abre el selector, pero no cambia la foto) -->
    <input type="file" id="imagen-perfil" accept="image/*" hidden>
    <label for="imagen-perfil" class="cambiar-imagen">
      Cambiar foto de perfil
    </label>

  </div>

  <!-- DATOS PERSONALES -->
  <section class="seccion-perfil">

    <h3>Datos personales</h3>

    <div class="campo-perfil">
      <label for="nombre-perfil">Nombre</label>
      <input
        id="nombre-perfil"
        type="text"
        [value]="datos().nombre"
        placeholder="Introduce tu nombre">
    </div>

    <div class="campo-perfil">
      <label for="correo-perfil">Correo electrónico</label>
      <input
        id="correo-perfil"
        type="email"
        [value]="datos().correo"
        placeholder="Introduce tu correo">
    </div>

  </section>

  <!-- PREFERENCIAS -->
  <section class="seccion-perfil">

    <h3>Preferencias</h3>

    <div class="preferencia">

      <div class="texto-preferencia">
        <strong>Modo oscuro</strong>
        <p>Cambia la apariencia de SmartChef a un tema oscuro.</p>
      </div>

      <ion-toggle
        [checked]="modoOscuro"
        (ionChange)="cambiarTema($event)"
        aria-label="Activar modo oscuro">
      </ion-toggle>

    </div>

  </section>

  <!-- HUECO: el botón de guardar lo pone la página -->
  <ng-content />

</div>
