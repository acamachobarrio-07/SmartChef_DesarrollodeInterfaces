<ion-content [fullscreen]="true">

  <div class="pantalla-anadir">

    <app-cabecera [volver]="true"></app-cabecera>

    <h1>Añadir ingredientes</h1>

    <div class="columnas">

      <section class="columna-categorias">

        <h2>Categoría</h2>

        @for (categoria of categorias; track categoria.nombre) {

          <app-tarjeta-categoria
            [nombre]="categoria.nombre"
            [imagen]="categoria.imagen"
            [seleccionada]="categoriaSeleccionada === categoria.nombre"
            (seleccionar)="cambiarCategoria($event)">
          </app-tarjeta-categoria>

        }

      </section>

      <section class="columna-ingredientes">

        <h2>Ingredientes</h2>

        @for (ingrediente of ingredientesCategoria; track ingrediente.id) {

          <app-tarjeta-ingrediente
            [ingrediente]="ingrediente"
            (seleccionar)="abrirAnadir($event)">
          </app-tarjeta-ingrediente>

        } @empty {

          <p class="sin-ingredientes">
            No hay ingredientes en esta categoría.
          </p>

        }

      </section>

    </div>

  </div>

</ion-content>


<!-- VENTANA PARA AÑADIR UN INGREDIENTE A MI DESPENSA -->
<ion-modal
  [isOpen]="modalAbierto"
  (didDismiss)="modalAbierto = false"
  [initialBreakpoint]="0.75"
  [breakpoints]="[0, 0.75, 1]">

  <ng-template>

    <ion-content class="ion-padding">

      @if (ingredienteSeleccionado; as i) {

        @if (!anadido) {

          <app-formulario-ingrediente
            [ingrediente]="i"
            (guardar)="anadido = true"
            (cancelar)="modalAbierto = false">
          </app-formulario-ingrediente>

        } @else {

          <app-confirmacion-receta
            titulo="¡Ingrediente añadido!"
            [mensaje]="i.nombre + ' se ha añadido a tu despensa.'"
            (aceptar)="modalAbierto = false">
          </app-confirmacion-receta>

        }

      }

    </ion-content>

  </ng-template>

</ion-modal>
