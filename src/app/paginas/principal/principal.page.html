<ion-content [fullscreen]="true">

  <div class="principal">

    <!-- Cabecera -->
    <div class="cabecera">

      <img
        src="assets/fotos/logo-smartchef.png"
        alt="SmartChef"
        class="logo">

      <ion-icon
        name="person-circle-outline"
        class="usuario">
      </ion-icon>

    </div>

    <!-- Buscador -->
    <ion-searchbar
      placeholder="Buscar ingrediente o receta...">
    </ion-searchbar>

    <!-- Recomendaciones -->
    <section class="recomendaciones">

      <h1>Recomendaciones de recetas</h1>

      <a routerLink="/app/recetas" class="ver-todas">
        Ver todas
        <ion-icon name="chevron-forward-circle"></ion-icon>
      </a>

      <!-- Tarjetas reutilizables -->
      @for (receta of recetas; track receta.id) {

        <app-tarjeta-receta
          [receta]="receta">
        </app-tarjeta-receta>

      }

    </section>

  </div>

</ion-content>
