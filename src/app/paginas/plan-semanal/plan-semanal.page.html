<ion-content [fullscreen]="true">

  <div class="pantalla-plan">

    <app-cabecera></app-cabecera>

    <h1>Plan semanal</h1>

    <div class="selector-semana">

      <button type="button" class="flecha" aria-label="Semana anterior">
        <ion-icon name="arrow-back"></ion-icon>
      </button>

      <button type="button" class="fecha-semana">
        <ion-icon name="calendar-outline"></ion-icon>
        {{ semana }}
      </button>

      <button type="button" class="flecha" aria-label="Semana siguiente">
        <ion-icon name="arrow-forward"></ion-icon>
      </button>

    </div>

    <app-resumen-calorias [calorias]="1978"></app-resumen-calorias>

    <!-- dias de la semana -->
    @for (dia of dias; track dia.nombre) {

      <section class="dia-semana">

        <h2>{{ dia.nombre }}</h2>

        <ion-card>

          <ion-card-content>

            <app-tarjeta-comida
              tipo="Desayuno"
              [receta]="dia.desayuno"
              (click)="abrirRecetas(dia.nombre, 'Desayuno')">
            </app-tarjeta-comida>

            <app-tarjeta-comida
              tipo="Comida"
              [receta]="dia.comida"
              (click)="abrirRecetas(dia.nombre, 'Comida')">
            </app-tarjeta-comida>

            <app-tarjeta-comida
              tipo="Cena"
              [receta]="dia.cena"
              (click)="abrirRecetas(dia.nombre, 'Cena')">
            </app-tarjeta-comida>

          </ion-card-content>

        </ion-card>

      </section>

    }

  </div>

</ion-content>


<!-- modal para seleccionar la receta -->
<ion-modal
  [isOpen]="modalRecetasAbierto"
  (didDismiss)="modalRecetasAbierto = false"
  [initialBreakpoint]="0.75"
  [breakpoints]="[0, 0.75, 1]">

  <ng-template>

    <ion-content class="ion-padding">

      @if (!recetaElegida) {

        <div class="seleccionar-receta">

          <h2>Seleccionar receta</h2>

          <p>{{ comidaSeleccionada }}</p>

          @for (receta of recetas; track receta.id) {

            <button
              type="button"
              class="opcion-receta"
              (click)="recetaElegida = receta">

              <img [src]="receta.imagen" [alt]="receta.nombre">

              <span>{{ receta.nombre }}</span>

            </button>

          }

          <button
            type="button"
            class="boton-cerrar"
            (click)="modalRecetasAbierto = false">

            Cancelar

          </button>

        </div>

      } @else {

        <app-confirmacion-receta
          titulo="¡Añadida al plan!"
          [mensaje]="recetaElegida.nombre + ' se ha añadido a ' + comidaSeleccionada + '.'">
          <ion-button class="boton-ventana" expand="block" (click)="modalRecetasAbierto = false">
            Aceptar
          </ion-button>
        </app-confirmacion-receta>

      }

    </ion-content>

  </ng-template>

</ion-modal>
