<ion-content [fullscreen]="true">

  <div class="pantalla-plan">

    <app-cabecera></app-cabecera>

    <h1>Plan semanal</h1>

    <div class="selector-semana">

      <button
        type="button"
        class="flecha"
        (click)="cambiarSemana(-1)">

        <ion-icon name="arrow-back"></ion-icon>

      </button>

      <button
        type="button"
        class="fecha-semana"
        (click)="abrirCalendario()">

        <ion-icon name="calendar-outline"></ion-icon>

        {{ tituloSemana }}

      </button>

      <button
        type="button"
        class="flecha"
        (click)="cambiarSemana(1)">

        <ion-icon name="arrow-forward"></ion-icon>

      </button>

    </div>

    @for (dia of dias; track formatoFecha(dia)) {

      <section class="dia-semana">

        <h2>
          {{ nombreDia(dia) }}
          {{ dia.getDate() }}
        </h2>

        <ion-card>

          <ion-card-content>

            @for (comida of comidas; track comida) {

              <app-tarjeta-comida
                [tipo]="comida"
                [receta]="obtenerReceta(dia, comida)"
                (anadir)="abrirRecetas(dia, comida)">
              </app-tarjeta-comida>

            }

          </ion-card-content>

        </ion-card>

      </section>

    }

  </div>

</ion-content>


<!-- CALENDARIO -->
<ion-modal
  [isOpen]="calendarioAbierto"
  (didDismiss)="calendarioAbierto = false">

  <ng-template>

    <ion-content class="ion-padding">

      <h2>Seleccionar fecha</h2>

      <ion-datetime
        presentation="date"
        locale="es-ES"
        [firstDayOfWeek]="1"
        [value]="fechaCalendario"
        (ionChange)="elegirFecha($event.detail.value)">
      </ion-datetime>

      <button
        type="button"
        class="boton-cerrar"
        (click)="calendarioAbierto = false">

        Cerrar

      </button>

    </ion-content>

  </ng-template>

</ion-modal>


<!-- SELECCIONAR RECETA -->
<ion-modal
  [isOpen]="modalRecetasAbierto"
  [initialBreakpoint]="0.75"
  [breakpoints]="[0, 0.75, 1]"
  (didDismiss)="alCerrarRecetas()">

  <ng-template>

    <ion-content class="ion-padding">

      <div class="seleccionar-receta">

        <h2>Seleccionar receta</h2>

        <p>{{ comidaSeleccionada }}</p>

        @for (receta of recetas; track receta.id) {

          <button
            type="button"
            class="opcion-receta"
            (click)="elegirReceta(receta)">

            <img
              [src]="receta.imagen"
              [alt]="receta.nombre">

            <span>
              {{ receta.nombre }}
            </span>

          </button>

        }

        <button
          type="button"
          class="boton-cerrar"
          (click)="modalRecetasAbierto = false">

          Cancelar

        </button>

      </div>

    </ion-content>

  </ng-template>

</ion-modal>


<!-- CONFIRMACIÓN -->
<ion-modal
  [isOpen]="modalConfirmacionAbierto"
  [initialBreakpoint]="0.55"
  [breakpoints]="[0, 0.55, 1]"
  (didDismiss)="modalConfirmacionAbierto = false">

  <ng-template>

    <ion-content class="ion-padding">

      <app-confirmacion-receta
        [mensaje]="mensajeConfirmacion"
        (aceptar)="modalConfirmacionAbierto = false">
      </app-confirmacion-receta>

    </ion-content>

  </ng-template>

</ion-modal>
