<ion-content [fullscreen]="true">

  <div class="pantalla-recetas">

    <!-- CABECERA REUTILIZABLE (con flecha para volver) -->
    <app-cabecera [volver]="true"></app-cabecera>

    <!-- BUSCADOR Y FILTROS -->
    <div class="zona-busqueda">

      <div class="barra-busqueda">

        <ion-icon name="search-outline"></ion-icon>

        <input
          type="text"
          placeholder="Buscar ingrediente o receta..."
          aria-label="Buscar ingrediente o receta">

        <button
          type="button"
          class="boton-filtros"
          aria-label="Abrir filtros"
          [attr.aria-expanded]="panelFiltrosAbierto"
          (click)="panelFiltrosAbierto = !panelFiltrosAbierto">

          <ion-icon name="menu-outline"></ion-icon>

        </button>

      </div>

      <!-- PANEL DE FILTROS -->
      @if (panelFiltrosAbierto) {

        <div class="panel-filtros">

          <!-- VEGETARIANO -->
          <button
            type="button"
            class="opcion-filtro"
            (click)="alternarFiltro('vegetariano')">

            vegetariano

            @if (filtros.vegetariano) {
              <span>✓</span>
            }

          </button>

          <!-- SIN GLUTEN -->
          <button
            type="button"
            class="opcion-filtro"
            (click)="alternarFiltro('sinGluten')">

            sin gluten

            @if (filtros.sinGluten) {
              <span>✓</span>
            }

          </button>

          <!-- RÁPIDO -->
          <button
            type="button"
            class="opcion-filtro"
            (click)="alternarFiltro('rapido')">

            rápido

            @if (filtros.rapido) {
              <span>✓</span>
            }

          </button>

          <!-- ECONÓMICO -->
          <button
            type="button"
            class="opcion-filtro"
            (click)="alternarFiltro('economico')">

            económico

            @if (filtros.economico) {
              <span>✓</span>
            }

          </button>

          <!-- DIFICULTAD -->
          <button
            type="button"
            class="opcion-filtro"
            (click)="mostrarDificultad = !mostrarDificultad">

            dificultad

          </button>

          @if (mostrarDificultad) {

            <select aria-label="Dificultad">

              <option value="Todas">Todas</option>
              <option value="Fácil">Fácil</option>
              <option value="Media">Media</option>
              <option value="Difícil">Difícil</option>

            </select>

          }

          <!-- TIEMPO MÁXIMO -->
          <button
            type="button"
            class="opcion-filtro"
            (click)="mostrarTiempo = !mostrarTiempo">

            tiempo máximo

          </button>

          @if (mostrarTiempo) {

            <select aria-label="Tiempo máximo">

              <option>Sin límite</option>
              <option>5 minutos</option>
              <option>10 minutos</option>
              <option>20 minutos</option>
              <option>30 minutos</option>
              <option>60 minutos</option>

            </select>

          }

          <!-- LIMPIAR FILTROS -->
          <button
            type="button"
            class="limpiar"
            (click)="limpiarFiltros()">

            Limpiar filtros

          </button>

        </div>

      }

    </div>

    <!-- LISTADO DE RECETAS -->
    <section class="listado-recetas">

      <h1>Todas las recetas</h1>

      <!-- COMPONENTE REUTILIZABLE -->
      @for (receta of recetas; track receta.id) {

        <app-tarjeta-receta
          [receta]="receta">
        </app-tarjeta-receta>

      } @empty {

        <p class="sin-resultados">
          No se encontraron recetas con los filtros seleccionados.
        </p>

      }

    </section>

  </div>

</ion-content>
