<ion-content [fullscreen]="true">

  <div class="pantalla-recetas">

    <!-- cabecera reutilizable -->
    <app-cabecera volver="/app/inicio"></app-cabecera>

    <div class="zona-busqueda">

      <div class="barra-busqueda">

        <ion-icon name="search-outline"></ion-icon>

        <input
          type="text"
          placeholder="Buscar ingrediente o receta..."
          aria-label="Buscar ingrediente o receta">

        <button
          type="button"
          class="boton-filtros"
          aria-label="Abrir filtros"
          (click)="panelFiltrosAbierto = !panelFiltrosAbierto">

          <ion-icon name="menu-outline"></ion-icon>

        </button>

      </div>

      <!-- panel de filtros -->
      @if (panelFiltrosAbierto) {

        <div class="panel-filtros">

          <!-- ahora mismo no filtra, es una maqueta -->
          @for (filtro of filtros; track filtro.nombre) {

            <button
              type="button"
              class="opcion-filtro"
              (click)="alternar(filtro)">

              {{ filtro.nombre }}

              @if (filtro.marcado) {
                <span>✓</span>
              }

            </button>

          }


          <button
            type="button"
            class="opcion-filtro"
            (click)="mostrarDificultad = !mostrarDificultad">

            dificultad

          </button>

          @if (mostrarDificultad) {

            <select aria-label="Dificultad">

              <option value="Todas">Todas</option>
              <option value="Fácil">Fácil</option>
              <option value="Media">Media</option>
              <option value="Difícil">Difícil</option>

            </select>

          }

          <button
            type="button"
            class="opcion-filtro"
            (click)="mostrarTiempo = !mostrarTiempo">

            tiempo máximo

          </button>

          @if (mostrarTiempo) {

            <select aria-label="Tiempo máximo">

              <option>Sin límite</option>
              <option>5 minutos</option>
              <option>10 minutos</option>
              <option>20 minutos</option>
              <option>30 minutos</option>
              <option>60 minutos</option>

            </select>

          }

          <button
            type="button"
            class="limpiar"
            (click)="limpiarFiltros()">

            Limpiar filtros

          </button>

        </div>

      }

    </div>

    <!-- listado de recetas -->
    <section class="listado-recetas">

      <h1>Todas las recetas</h1>

      @for (receta of recetas; track receta.id) {

        <app-tarjeta-receta
          [receta]="receta">
        </app-tarjeta-receta>

      } @empty {

        <p class="sin-resultados">
          No se encontraron recetas con los filtros seleccionados.
        </p>

      }

    </section>

  </div>

</ion-content>
