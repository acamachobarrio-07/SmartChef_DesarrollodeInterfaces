<ion-content [fullscreen]="true">

  <div class="pantalla-confirmacion">

    <div class="cabecera-confirmacion">

      <img
        src="assets/fotos/logo-smartchef.png"
        alt="SmartChef"
        class="logo">

      <img
        src="assets/fotos/ensalada-bienvenida.png"
        alt=""
        class="ensalada">

    </div>

    <div class="contenido-confirmacion">

      <ion-icon
        name="checkmark-circle"
        class="icono-confirmacion">
      </ion-icon>

      <h1>¡Cuenta creada!</h1>

      <p class="descripcion">
        Tu cuenta ha sido creada correctamente.
      </p>

      <ion-button
        expand="block"
        routerLink="/login"
        class="volver-login">
        Volver al inicio de sesión
      </ion-button>

    </div>

    <div class="pie-confirmacion">

      <ion-icon
        name="leaf"
        class="hojas">
      </ion-icon>

    </div>

  </div>

</ion-content>
