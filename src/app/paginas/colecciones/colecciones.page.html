<ion-content [fullscreen]="true">

  <div class="pantalla-colecciones">

    <!-- CABECERA REUTILIZABLE -->
    <app-cabecera></app-cabecera>

    <!-- BUSCADOR (visual, como en el inicio) -->
    <ion-searchbar
      placeholder="Buscar ingrediente o receta..."
      class="buscador">
    </ion-searchbar>

    <h1>Mis colecciones</h1>

    <!-- CUADRÍCULA DE COLECCIONES -->
    <div class="cuadricula">

      @for (coleccion of colecciones; track coleccion.id) {

        <div class="tarjeta-coleccion">
          <h2>{{ coleccion.nombre }}</h2>
          <img [src]="coleccion.imagen" [alt]="coleccion.nombre">
        </div>

      }

    </div>

  </div>

</ion-content>
