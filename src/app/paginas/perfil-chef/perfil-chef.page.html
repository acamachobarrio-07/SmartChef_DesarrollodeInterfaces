<!-- PÁGINA DEL PERFIL DEL CHEF -->
<ion-content>

  <!-- FORMULARIO REUTILIZABLE -->
  <app-formulario-perfil
    [datos]="datosPerfil"
    volver="/inicio-chef">

    <ion-button class="boton-ventana" expand="block" (click)="modalConfirmacionAbierto = true">
      Guardar cambios
    </ion-button>

  </app-formulario-perfil>

</ion-content>


<!-- MODAL DE CONFIRMACIÓN -->
<ion-modal
  [isOpen]="modalConfirmacionAbierto"
  [initialBreakpoint]="0.55"
  [breakpoints]="[0, 0.55, 1]"
  (didDismiss)="modalConfirmacionAbierto = false">

  <ng-template>

    <ion-content class="ion-padding">

      <app-confirmacion-receta
        mensaje="Perfil actualizado correctamente.">
        <ion-button
          class="boton-ventana"
          expand="block"
          routerLink="/inicio-chef"
          routerDirection="back"
          (click)="modalConfirmacionAbierto = false">
          Aceptar
        </ion-button>
      </app-confirmacion-receta>

    </ion-content>

  </ng-template>

</ion-modal>
