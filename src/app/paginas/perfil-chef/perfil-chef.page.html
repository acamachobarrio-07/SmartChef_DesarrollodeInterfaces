
<!-- PÁGINA DEL PERFIL DEL CHEF -->

<ion-content>

  <!-- FORMULARIO REUTILIZABLE -->
  <app-formulario-perfil
    [datos]="datosPerfil"
    (guardar)="guardarPerfil($event)"
    (cerrar)="cerrarPerfil()"
    (cambiarTema)="cambiarTema($event)">
  </app-formulario-perfil>

</ion-content>


<!-- MODAL DE CONFIRMACIÓN -->

<ion-modal
  [isOpen]="modalConfirmacionAbierto"
  [initialBreakpoint]="0.55"
  [breakpoints]="[0, 0.55, 1]"
  (didDismiss)="alCerrarConfirmacion()">

  <ng-template>

    <ion-content class="ion-padding">

      <app-confirmacion-receta
        mensaje="Perfil actualizado correctamente."
        (aceptar)="aceptarConfirmacion()">
      </app-confirmacion-receta>

    </ion-content>

  </ng-template>

</ion-modal>
