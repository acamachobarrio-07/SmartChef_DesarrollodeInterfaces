<ion-tabs>

  <ion-tab-bar slot="bottom">

    <!-- INICIO -->
    <ion-tab-button
      [tab]="sesion.comprobarSesion() ? 'inicio-login' : 'inicio'">

      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Inicio</ion-label>

    </ion-tab-button>

    <!-- INGREDIENTES -->
    <ion-tab-button
      [tab]="sesion.comprobarSesion() ? 'ingredientes' : undefined"
      (click)="comprobarAcceso('Ingredientes')">

      <ion-icon name="nutrition-outline"></ion-icon>
      <ion-label>Ingredientes</ion-label>

    </ion-tab-button>

    <!-- LISTA DE COMPRA -->
    <ion-tab-button
      [tab]="sesion.comprobarSesion() ? 'lista-compra' : undefined"
      (click)="comprobarAcceso('Lista de compra')">

      <ion-icon name="clipboard-outline"></ion-icon>
      <ion-label>Lista compra</ion-label>

    </ion-tab-button>

    <!-- PLAN SEMANAL -->
    <ion-tab-button
      [tab]="sesion.comprobarSesion() ? 'plan-semanal' : undefined"
      (click)="comprobarAcceso('Plan semanal')">

      <ion-icon name="calendar-outline"></ion-icon>
      <ion-label>Plan</ion-label>

    </ion-tab-button>

    <!-- COLECCIONES -->
    <ion-tab-button
      [tab]="sesion.comprobarSesion() ? 'colecciones' : undefined"
      (click)="comprobarAcceso('Colecciones')">

      <ion-icon name="bookmark-outline"></ion-icon>
      <ion-label>Colección</ion-label>

    </ion-tab-button>

  </ion-tab-bar>

</ion-tabs>

<!-- MODAL DE ACCESO RESTRINGIDO -->
<ion-modal
  [isOpen]="modalAbierto"
  [initialBreakpoint]="0.5"
  [breakpoints]="[0, 0.5, 0.75]"
  cssClass="modal-acceso"
  (didDismiss)="cerrarModal()">

  <ng-template>

    <ion-content>

      <div class="aviso-acceso">

        <div class="icono-acceso">
          <ion-icon name="lock-closed-outline"></ion-icon>
        </div>

        <h2>¡Inicia sesión!</h2>

        <p>
          Para acceder a {{ seccion }}
          necesitas iniciar sesión en SmartChef.
        </p>

        <div class="botones-acceso">

          <ion-button
            expand="block"
            shape="round"
            routerLink="/login"
            (click)="cerrarModal()">

            Iniciar sesión

          </ion-button>

          <ion-button
            expand="block"
            shape="round"
            fill="outline"
            color="medium"
            (click)="cerrarModal()">

            Cancelar

          </ion-button>

        </div>

      </div>

    </ion-content>

  </ng-template>

</ion-modal>
