<ion-content [fullscreen]="true">

  <div class="principal-login">

    <header class="cabecera-login">

      <button type="button" class="boton-notificaciones">
        <ion-icon name="notifications-outline"></ion-icon>
      </button>

      <img
        src="assets/fotos/logo-smartchef.png"
        alt="SmartChef"
        class="logo">

      <button
        type="button"
        id="boton-perfil-usuario"
        class="avatar-usuario"
        aria-label="Abrir menú de perfil">
        A
      </button>

    </header>

    <ion-searchbar
      placeholder="Buscar ingrediente o receta..."
      class="buscador">
    </ion-searchbar>

    <section class="recomendaciones">

      <h1>Recomendaciones de recetas</h1>

      <a routerLink="/app/recetas" class="ver-todas">
        Ver todas
        <ion-icon name="chevron-forward-circle"></ion-icon>
      </a>

      @for (receta of recetas; track receta.id) {

        <app-tarjeta-receta
          [receta]="receta">
        </app-tarjeta-receta>

      }

    </section>

  </div>

</ion-content>

<ion-popover
  #popoverPerfil
  trigger="boton-perfil-usuario"
  triggerAction="click"
  side="bottom"
  alignment="end"
  cssClass="popover-perfil-usuario"
  style="--width: 235px; --background: var(--app-superficie); --color: var(--app-texto);">

  <ng-template>

    <div class="menu-perfil-usuario">

      <div class="datos-menu">

        <div class="avatar-menu">A</div>

        <div class="texto-menu">
          <strong>Usuario</strong>
          <span>Mi cuenta</span>
        </div>

      </div>

      <div class="separador-menu"></div>

      <button
        type="button"
        class="opcion-menu"
        (click)="abrirEdicionPerfil()">

        <ion-icon name="create-outline"></ion-icon>
        <span>Editar perfil</span>

      </button>

      <button
        type="button"
        class="opcion-menu cerrar-sesion"
        (click)="cerrarSesion()">

        <ion-icon name="log-out-outline"></ion-icon>
        <span>Cerrar sesión</span>

      </button>

    </div>

  </ng-template>

</ion-popover>
