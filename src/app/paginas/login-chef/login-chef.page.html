<ion-content [fullscreen]="true">

  <div class="pantalla-login-chef">

    <div class="cabecera-login">

      <img
        src="assets/fotos/logo-smartchef.png"
        alt="SmartChef"
        class="logo">

      <span class="etiqueta-chef">
        Modo Chef
      </span>

    </div>

    <div class="presentacion">

      <h1>Acceso del Chef</h1>

      <p>
        Gestiona tus recetas de forma
        fácil y rápida.
      </p>

    </div>

    <div class="formulario-login">

      <div class="campo">

        <label for="correo-chef">
          Correo electrónico
        </label>

        <input
          id="correo-chef"
          type="email"
          placeholder="Introduce tu correo"
          autocomplete="email">

      </div>

      <div class="campo">

        <label for="contrasena-chef">
          Contraseña
        </label>

        <input
          id="contrasena-chef"
          type="password"
          placeholder="Introduce tu contraseña"
          autocomplete="current-password">

      </div>

      <a
        routerLink="/contrasena-olvidada-chef"
        class="olvidar-contrasena">

        ¿Olvidaste tu contraseña?

      </a>

      <!-- acceso para el modo chef -->
      <button
        type="button"
        class="boton-iniciar"
        routerLink="/inicio-chef">

        Iniciar sesión

      </button>


      <!-- volvemos al cliente -->
      <a
        routerLink="/home"
        class="volver-cliente">

        Volver al modo cliente

      </a>

    </div>


  </div>

</ion-content>
