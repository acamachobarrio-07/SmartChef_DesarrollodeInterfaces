<!-- PÁGINA PRINCIPAL DEL CHEF -->
<ion-content [fullscreen]="true">

  <div class="pantalla-chef">

    <!-- CABECERA -->
    <header class="cabecera-chef">

      <img
        src="assets/fotos/logo-smartchef.png"
        alt="SmartChef"
        class="logo">

      <!-- AVATAR PREDETERMINADO -->
      <div class="avatar" aria-label="Perfil de Ana">
        A
      </div>

    </header>

    <!-- BIENVENIDA -->
    <section class="bienvenida">

      <h1>Hola Ana</h1>

      <h2>Estás en el modo chef.</h2>

      <p>
        Gestiona y mantén actualizadas
        tus recetas.
      </p>

    </section>

    <!-- OPCIONES DEL CHEF -->
    <section class="opciones-chef">

      <!-- AÑADIR RECETA -->
      <button
        type="button"
        class="opcion opcion-anadir"
        (click)="modalAnadirAbierto = true">

        <div class="icono-opcion">
          <ion-icon name="add-outline"></ion-icon>
        </div>

        <div class="texto-opcion">
          <h3>Añadir receta</h3>
          <p>Crea una nueva receta</p>
        </div>

        <ion-icon
          name="chevron-forward-outline"
          class="flecha">
        </ion-icon>

      </button>


      <!-- MODIFICAR RECETA -->
      <button
        type="button"
        class="opcion opcion-modificar"
        (click)="modalSeleccionAbierto = true">

        <div class="icono-opcion">
          <ion-icon name="create-outline"></ion-icon>
        </div>

        <div class="texto-opcion">
          <h3>Modificar receta</h3>
          <p>Edita una receta existente</p>
        </div>

        <ion-icon
          name="chevron-forward-outline"
          class="flecha">
        </ion-icon>

      </button>


      <!-- ELIMINAR RECETA -->
      <article class="opcion opcion-eliminar">

        <div class="icono-opcion">
          <ion-icon name="trash-outline"></ion-icon>
        </div>

        <div class="texto-opcion">
          <h3>Eliminar receta</h3>
          <p>Elimina recetas del catálogo</p>
        </div>

        <ion-icon
          name="chevron-forward-outline"
          class="flecha">
        </ion-icon>

      </article>

    </section>

  </div>

</ion-content>


<!-- MODAL PARA AÑADIR RECETAS -->
<ion-modal
  [isOpen]="modalAnadirAbierto"
  [initialBreakpoint]="0.85"
  [breakpoints]="[0, 0.85, 1]"
  (didDismiss)="alCerrarModalAnadir()">

  <ng-template>

    <ion-content class="ion-padding">

      <!-- FORMULARIO REUTILIZABLE -->
      <app-formulario-receta
        modo="anadir"
        (guardar)="guardarReceta()"
        (cerrar)="modalAnadirAbierto = false">
      </app-formulario-receta>

    </ion-content>

  </ng-template>

</ion-modal>


<!-- MODAL DE CONFIRMACIÓN REUTILIZABLE -->
<ion-modal
  [isOpen]="modalConfirmacionAbierto"
  [initialBreakpoint]="0.55"
  [breakpoints]="[0, 0.55, 1]"
  (didDismiss)="modalConfirmacionAbierto = false">

  <ng-template>

    <ion-content class="ion-padding">

      <!-- COMPONENTE REUTILIZABLE -->
      <app-confirmacion-receta
        [mensaje]="mensajeConfirmacion"
        (aceptar)="modalConfirmacionAbierto = false">
      </app-confirmacion-receta>

    </ion-content>

  </ng-template>

</ion-modal>


<!-- MODAL PARA SELECCIONAR RECETA -->
<ion-modal
  [isOpen]="modalSeleccionAbierto"
  [initialBreakpoint]="0.9"
  [breakpoints]="[0, 0.9, 1]"
  (didDismiss)="alCerrarSeleccion()">

  <ng-template>

    <ion-content class="ion-padding">

      <div class="lista-recetas-chef">

        <h2>Selecciona una receta</h2>

        <p>Elige la receta que quieres modificar.</p>

        @for (receta of recetasChef; track receta.id) {

          <app-tarjeta-receta
            [receta]="receta"
            modo="modificar"
            (seleccionar)="seleccionarRecetaParaModificar($event)">
          </app-tarjeta-receta>

        }

      </div>

    </ion-content>

  </ng-template>

</ion-modal>


<!-- MODAL PARA MODIFICAR RECETA -->
<ion-modal
  [isOpen]="modalModificarAbierto"
  [initialBreakpoint]="0.85"
  [breakpoints]="[0, 0.85, 1]"
  (didDismiss)="alCerrarModalModificar()">

  <ng-template>

    <ion-content class="ion-padding">

      @if (datosModificar) {

        <app-formulario-receta
          modo="modificar"
          [receta]="datosModificar"
          (guardar)="guardarModificacion($event)"
          (cerrar)="modalModificarAbierto = false">
        </app-formulario-receta>

      }

    </ion-content>

  </ng-template>

</ion-modal>
