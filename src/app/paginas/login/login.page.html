
<ion-content [fullscreen]="true">

  <div class="pantalla-login">

    <!-- Parte superior -->
    <div class="cabecera-login">

      <img
        src="assets/fotos/logo-smartchef.png"
        alt="SmartChef"
        class="logo">

      <img
        src="assets/fotos/ensalada-bienvenida.png"
        alt=""
        class="ensalada">

      <p class="eslogan">
        Sabor que aprovecha<br>
        cada ingrediente.
      </p>

    </div>

    <!-- Formulario de acceso -->
    <div class="formulario-login">
      <!-- Correo electrónico -->
      <div class="campo">
        <ion-icon name="mail-outline"></ion-icon>

        <ion-input
          type="email"
          placeholder="Correo electrónico"
          aria-label="Correo electrónico">
        </ion-input>
      </div>

      <!-- Contraseña -->
      <div class="campo">
        <ion-icon name="lock-closed-outline"></ion-icon>

        <ion-input
          type="password"
          placeholder="Contraseña"
          aria-label="Contraseña">
        </ion-input>

        <ion-icon name="eye-off-outline"></ion-icon>
      </div>


      <a routerLink="/contrasena-olvidada" class="olvido">
        ¿Olvidaste tu contraseña?
      </a>


      <!-- Botones -->
      <div class="botones">

        <ion-button (click)="iniciarSesion()"
          expand="block"
          routerDirection="root"
          class="iniciar-sesion">
          Iniciar sesión
        </ion-button>


        <ion-button
          routerLink="/login-chef"
          routerDirection="root"
          class="soy-chef">
          Soy chef
        </ion-button>


      </div>

    </div>

    <!-- Parte inferior -->
    <div class="pie-login">

      <p>¿No tienes una cuenta?</p>

      <a routerLink="/registro" class="crear-cuenta">
        Crear cuenta
      </a>


      <a routerLink="/app/inicio" class="invitado">
        Volver al modo invitado
      </a>

      <ion-icon name="leaf" class="hojas"></ion-icon>

    </div>

  </div>

</ion-content>
