<ion-content [fullscreen]="true">

  <div class="pantalla-confirmacion">

    <div class="cabecera-confirmacion">

      <img
        src="assets/fotos/logo-smartchef.png"
        alt="SmartChef"
        class="logo">

      <img
        src="assets/fotos/ensalada-bienvenida.png"
        alt=""
        class="ensalada">

    </div>

    <div class="contenido-confirmacion">

      <ion-icon
        name="checkmark-circle"
        class="icono-confirmacion">
      </ion-icon>

      <h1>¡Correo enviado!</h1>

      <p class="descripcion">
        Hemos enviado un enlace para restablecer tu
        contraseña a la dirección:
      </p>

      <div class="campo">

        <ion-icon name="mail-outline"></ion-icon>

        <ion-input
          type="email"
          value="smartchefpruebachef@gmail.com"
          [readonly]="true"
          aria-label="Correo electrónico">
        </ion-input>

      </div>

      <ion-button
        expand="block"
        routerLink="/login-chef"
        routerDirection="root"
        class="volver-login">
        Volver al inicio de sesión
      </ion-button>

      <p class="reenviar">
        Reenviar correo (en 1:00)
      </p>

    </div>

    <div class="pie-confirmacion">
      <ion-icon name="leaf" class="hojas"></ion-icon>
    </div>

  </div>

</ion-content>
